<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" shape-rendering="crispEdges">
  <rect width="200" height="140" fill="#1B1E28"/>

  <!-- ruangan-ruangan (top-down layout) -->
  <rect x="16" y="60" width="34" height="30" fill="#20263a" stroke="#262A36" stroke-width="2"/>
  <rect x="82" y="20" width="34" height="30" fill="#20263a" stroke="#262A36" stroke-width="2"/>
  <rect x="82" y="90" width="34" height="30" fill="#20263a" stroke="#262A36" stroke-width="2"/>
  <rect x="150" y="55" width="34" height="34" fill="#20263a" stroke="#262A36" stroke-width="2"/>

  <!-- jalur alur pemain (dotted path) -->
  <g fill="#E8A23D">
    <rect x="50" y="73" width="6" height="4"/><rect x="60" y="73" width="6" height="4"/><rect x="70" y="73" width="6" height="4"/>
    <rect x="99" y="50" width="4" height="6"/><rect x="99" y="60" width="4" height="6"/>
    <rect x="99" y="70" width="4" height="6"/>
    <rect x="99" y="80" width="4" height="6"/>
    <rect x="116" y="33" width="6" height="4"/><rect x="126" y="33" width="6" height="4"/>
    <rect x="136" y="33" width="6" height="4"/><rect x="146" y="33" width="6" height="4"/>
    <rect x="116" y="105" width="6" height="4"/><rect x="126" y="105" width="6" height="4"/>
    <rect x="136" y="72" width="6" height="4"/><rect x="146" y="72" width="6" height="4"/>
  </g>

  <!-- titik mulai & akhir -->
  <rect x="26" y="70" width="12" height="12" fill="#34C29B"/>
  <rect x="160" y="65" width="12" height="12" fill="#6C63F2"/>

  <!-- label ikon musuh / objek -->
  <rect x="94" y="30" width="8" height="8" fill="#E86A5C"/>
  <rect x="94" y="100" width="8" height="8" fill="#E86A5C"/>
</svg>
